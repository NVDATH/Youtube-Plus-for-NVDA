name: Notify Translators of New Strings

# How to run this (no need to push a tag / no need to make a release):
#   1. Open the repo on GitHub
#   2. Go to the "Actions" tab (top menu bar of the repo)
#   3. Click this workflow's name on the left: "Notify Translators of New Strings"
#   4. A green "Run workflow" button appears on the right -> click it
#   5. Pick the branch to run on (usually main) -> click "Run workflow" again
#   6. Wait a moment; check the result under the repo's Issues tab
on:
  workflow_dispatch: {}   # lets this be triggered manually from the Actions tab, as above

jobs:
  sync_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the .pot/buildVars.py changes back to the repo
      issues: write     # needed to open/edit an Issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          pip install scons markdown

      # No tag right now -> the script falls back to the topmost heading in changelog.md
      - name: Sync latest changelog into buildVars.py
        run: python scripts/sync_changelog.py

      - name: Build .pot only (skip building the full add-on)
        run: scons pot

      - name: Check if .pot actually changed
        id: potdiff
        run: |
          git add YoutubePlus.pot buildVars.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated .pot and buildVars.py
        if: steps.potdiff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync changelog + update .pot for translators"
          git push

      # ---- Edit the list of mentioned people here (add/remove anyone later) ----
      - name: Open issue notifying translators
        if: steps.potdiff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // TODO: fill in real translator usernames once NVSky has translators.
            // Testing for now with just the maintainer's own account.
            const assignees = [
              "NVDATH",
              "ninhhoang205",
              "ana-giselle-ar86",
              "George-br",
              "EdilbertoFonseca",
            ];
            const mentions = assignees.map(u => `@${u}`).join(" ");
            const repo = context.repo;
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const potRawUrl = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${context.ref.replace('refs/heads/','')}/NVSky.pot`;
            const changelogRawUrl = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${context.ref.replace('refs/heads/','')}/changelog.md`;
            const readmeRawUrl = `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${context.ref.replace('refs/heads/','')}/readme.md`;

            const body = [
              mentions,
              "",
              "There are new or updated strings (or an updated changelog) that need translation before the next release.",
              "",
              `- Latest .pot file: ${potRawUrl}`,
              `- Latest changelog.md: ${changelogRawUrl}`,
              `- Latest readme.md (also needs translating): ${readmeRawUrl}`,
              `- Workflow run: ${runUrl}`,
              "",
              "How to update a translation: open your language's .po file in Poedit, press \"Update from POT\" and point it at the .pot file above, translate the new strings, then send the .po file back as a Pull Request.",
              "The readme is translated as a file, not through the .po file: copy readme.md to addon/doc/<language code>/readme.md, translate it, and send it in the same Pull Request.",
            ].join("\n");

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `Translation update needed: new strings (${new Date().toISOString().slice(0,10)})`,
              body: body,
            });
            // Note: not using GitHub's real "assignees" field -- that API requires
            // the person to be a repo collaborator, which a translator sending a PR
            // usually isn't. @mentioning them in the issue body (above) notifies them
            // the same way without that restriction.

      - name: No changes detected
        if: steps.potdiff.outputs.changed == 'false'
        run: echo "changelog.md has no changes that affect the .pot file -- no issue opened"
