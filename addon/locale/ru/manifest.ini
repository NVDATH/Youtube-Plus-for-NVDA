changelog = """### Новые возможности

* Загрузка видео теперь объединяет отдельные видеопотоки и аудиопотоки через FFmpeg, поскольку YouTube отказался от совмещённых прогрессивных потоков для большинства видео. Если FFmpeg не найден в вашей системе, YoutubePlus предлагает установить его автоматически через winget с помощью одного запроса «Да/Нет».
* Добавлен новый раздел «Параметры качества и формата загрузки» (Alt+D) в настройках, позволяющий установить предпочтительное качество видео (от наилучшего до 360p), контейнер видео (MP4/MKV/WebM), качество аудио при преобразовании (от наилучшего до 96 kbps) и формат аудио (сохранить исходный или преобразовать в MP3, WAV, M4A/AAC, FLAC, Opus или Vorbis).

### Улучшения

* Исправлено: после фонового обновления ленты подписок список видео теперь надёжно сохраняет (или восстанавливает) фокус клавиатуры, вместо того чтобы иногда правильно перезагружаться, но оставлять список не реагирующим на клавиатуру до тех пор, пока фокус не будет восстановлен вручную.

### Исправления ошибок

* Исправлена ошибка загрузки видео с сообщением «Запрашиваемый формат недоступен» для большинства видео, вызванная удалением YouTube совмещённых форматов видео+аудио, на которые ранее полагалась эта функция.

### Переводы

* Исправлены и дополнены переводы на тайский, украинский, русский, испанский и бразильский португальский языки — включая ряд ранее существовавших неправильных или отсутствующих переводов, обнаруженных в ходе этого обновления, а также строки для новых функций, перечисленных выше."""
