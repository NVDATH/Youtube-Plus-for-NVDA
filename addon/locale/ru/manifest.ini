summary = "YoutubePlus (Расширенные возможности YouTube)"
description = """
Дополнение YouTube Plus для NVDA предоставляет удобный доступ к функциям YouTube, которые обычно неудобно использовать: чтение комментариев, просмотр информации о видео, временные метки и главы.
Вы можете искать видео, сохранять избранное (видео, каналы, плейлисты), создавать список просмотра и подписываться на каналы без привязки к аккаунту Google.
Лента подписок показывает новые видео с отслеживаемых каналов с возможностью сортировки по категориям.
Доступен мониторинг живого чата во время трансляций с автоматическим озвучиванием сообщений и экспортом истории.
Поддерживается загрузка видео или только аудиодорожки.
Все функции доступны через многоуровневую систему горячих клавиш (NVDA+Y) и настраиваемые диалоги, не конфликтуя с другими командами NVDA.
YoutubePlus не требует API-ключей и не связывается с вашим аккаунтом YouTube, обеспечивая приватность.
Весь функционал дополнения и сочетания клавиш описаны в справочном руководстве.Все функциональные возможности дополнения и сочетания клавиш описаны в справочном руководстве.
"""
changelog = """### Новые функции

* Добавлена поддержка щелчка правой кнопкой мыши / клавиши «Контекстное меню» в диалоге ленты подписок — открывает то же меню «Действие», что и кнопка «Действие», включая опцию «Отписаться».

### Исправления ошибок

* Исправлена ошибка `[WinError 5] Access is denied` при переименовании профиля пользователя — вызванная тем, что соединения SQLite, открытые с помощью `with sqlite3.connect()`, не закрывались явно после выхода из блока, оставляя дескрипторы файлов открытыми в Windows.
* Исправлена проблема, при которой переименование профиля не выполнялось без сообщения об ошибке, когда имя папки, используемое в `ProfileManagementDialog`, не соответствовало регистру, используемому `get_profile_path()` (`youtubePlus` против `YoutubePlus`).

### Зависимости

* Обновлён yt-dlp до версии 2026.7.4

### Переводы

* Добавлен бразильский португальский (pt_BR) перевод интерфейса и документации — вклад от EdilbertoFonseca
* Добавлен испанский (es) перевод интерфейса и документации — вклад от ana-giselle-ar86
"""